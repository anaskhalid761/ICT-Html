<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History of HTML</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color:white-space;} 
        nav { background: #3b5e7d; padding: 15px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; }
        .wrapper { display: flex; flex-wrap: wrap; max-width: 1100px; margin: 20px auto; gap: 20px; padding: 25px; border-radius: 8px;}
        main { flex: 3; background: white; padding: 25px; border-radius: 8px; }
        aside { flex: 1; background: white; padding: 20px; border-radius: 8px; text-align: center;}
        h1 { background: #333; color: white; padding: 10px; border-radius: 8px;} 
        h2 { background: #ffd700; padding: 5px 15px; display: inline-block; color: #f9f9f9; }
    /*The Circle Image */
    .profile-img 
     {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid #ffd700;
        object-fit: cover;
    }
    .logo-gallery { text-align: center; padding: 15px; background: #f9f9f9, }
    footer { background: #333; color: white; text-align: center; padding: 20px; }
    </style>
</head>
</html>
